<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>right here</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#2B0E1F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#FBEEF0; --ink-dim:#E3B9C4; --bg-1:#2B0E1F; --bg-2:#5C1A34;
    --wine:#7A2048; --rose:#D68FA3; --gold:#F0C48A;
    --glass:rgba(255,255,255,0.06); --border:rgba(255,255,255,0.14);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Work Sans',sans-serif;
    background:
      radial-gradient(circle at 50% 18%, var(--wine) 0%, transparent 55%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
    color:var(--ink); min-height:100%;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; position:relative;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .wrap{width:100%;max-width:420px;padding:32px 28px;text-align:center;position:relative;z-index:2;}
  .eyebrow{font-size:13px;color:var(--ink-dim);letter-spacing:0.02em;margin:0 0 6px;}
  h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-style:italic;font-size:clamp(28px,7vw,38px);margin:0 0 36px;color:var(--ink);}
  .stage{position:relative;width:220px;height:220px;margin:0 auto 30px;display:flex;align-items:center;justify-content:center;}
  .ring{position:absolute;border-radius:50%;border:1px solid var(--border);opacity:0;}
  .heart-btn{
    position:relative;width:150px;height:150px;border-radius:50%;border:none;
    background:radial-gradient(circle at 35% 30%, var(--rose), var(--wine) 70%);
    box-shadow:0 0 40px rgba(214,143,163,0.35), inset 0 0 30px rgba(255,255,255,0.08);
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    animation:breathe 4.5s ease-in-out infinite;-webkit-tap-highlight-color:transparent;
  }
  .heart-btn svg{width:58px;height:58px;fill:var(--ink);opacity:0.95;}
  .heart-btn:active{transform:scale(0.95);}
  @keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.035);}}
  @media (prefers-reduced-motion: reduce){.heart-btn{animation:none;}}
  .status{font-size:14px;color:var(--ink-dim);min-height:20px;margin:0 0 4px;}
  .hint{font-size:12px;color:rgba(227,185,196,0.6);margin:18px 0 0;line-height:1.5;}
  .name-tag{font-size:12px;color:rgba(227,185,196,0.55);margin-top:22px;}
  .name-tag button{background:none;border:none;color:inherit;text-decoration:underline;cursor:pointer;font:inherit;padding:0;}
  .modal-veil{position:fixed;inset:0;background:rgba(20,6,14,0.72);display:flex;align-items:center;justify-content:center;z-index:10;padding:24px;}
  .modal{background:var(--bg-2);border:1px solid var(--border);border-radius:18px;padding:28px 24px;max-width:340px;width:100%;text-align:center;}
  .modal p{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:20px;margin:0 0 18px;}
  .modal input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:var(--glass);color:var(--ink);font-family:'Work Sans',sans-serif;font-size:15px;outline:none;margin-bottom:14px;text-align:center;}
  .modal input:focus{border-color:var(--rose);}
  .modal button.go{width:100%;padding:12px;border-radius:10px;border:none;background:var(--rose);color:var(--bg-1);font-weight:500;font-size:14px;cursor:pointer;}
  .float-heart{position:fixed;bottom:-30px;font-size:22px;opacity:0;pointer-events:none;z-index:5;animation:rise 3.2s ease-in forwards;}
  @keyframes rise{0%{transform:translateY(0) translateX(0) scale(0.8);opacity:0;}10%{opacity:0.9;}100%{transform:translateY(-92vh) translateX(var(--drift,0px)) scale(1.1);opacity:0;}}
  .banner{position:fixed;top:calc(env(safe-area-inset-top,0px) + 18px);left:50%;transform:translateX(-50%) translateY(-140%);background:var(--glass);border:1px solid var(--border);backdrop-filter:blur(6px);padding:10px 18px;border-radius:999px;font-size:13.5px;color:var(--ink);transition:transform 0.5s cubic-bezier(.2,.8,.2,1);z-index:8;white-space:nowrap;}
  .banner.show{transform:translateX(-50%) translateY(0);}
  .glow-wave{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(circle at 50% 50%, rgba(240,196,138,0.28), transparent 60%);opacity:0;}
  .glow-wave.pulse{animation:wave 1.8s ease-out;}
  @keyframes wave{0%{opacity:0;transform:scale(0.6);}30%{opacity:1;}100%{opacity:0;transform:scale(1.4);}}
</style>
</head>
<body>

<div class="glow-wave" id="glowWave"></div>
<div class="banner" id="banner"></div>

<div class="wrap">
  <p class="eyebrow">when i'm not next to you</p>
  <h1 id="heading">i'm right here</h1>
  <div class="stage">
    <div class="ring" id="ring1"></div>
    <div class="ring" id="ring2"></div>
    <button class="heart-btn" id="sendBtn" aria-label="Send a pulse">
      <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.9-10.2-9.3C.3 9 1.1 5.4 4.3 4.1c2.2-.9 4.5-.1 5.7 1.8C11.2 4 13.5 3.2 15.7 4.1c3.2 1.3 4 4.9 2.5 7.6C15.5 16.1 12 21 12 21z"/></svg>
    </button>
  </div>
  <p class="status" id="statusLine">click it whenever you miss me</p>
  <p class="hint">keep this open (or pop me on your home screen) — tap it and I'll feel it, wherever I am.</p>
  <p class="name-tag" id="nameTag"></p>
</div>

<div class="modal-veil" id="onboard">
  <div class="modal">
    <p>what should this call you?</p>
    <input id="nameInput" type="text" maxlength="20" placeholder="your name" autocomplete="off">
    <button class="go" id="nameGo">that's me</button>
  </div>
</div>

<!-- ============================================================
     SETUP (one-time, ~5 minutes) — do this before sharing the link
     1. Go to https://console.firebase.google.com -> Add project (free).
     2. In the project, click "Build > Realtime Database" -> Create
        Database -> start in TEST MODE.
     3. Go to Project settings (gear icon) > General > "Your apps" >
        click the </> (web) icon > register app (no hosting needed).
     4. Copy the firebaseConfig object it shows you and paste it
        below, replacing the placeholder.
     5. In Realtime Database > Rules, replace the rules with:
           { "rules": { "pulses": { ".read": true, ".write": true },
                        "tokens": { ".read": true, ".write": true } } }
        then click Publish. (This keeps it open only to whoever has
        the link -- fine for a just-us toy, don't put anything
        sensitive in it.)
     6. Upload this file to a GitHub repo and enable GitHub Pages,
        same as your portfolio site. Share that link with her.
     ============================================================ -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-messaging-compat.js"></script>
<script>
(function(){
  // ---- PASTE YOUR OWN CONFIG FROM FIREBASE HERE ----
  const firebaseConfig = {
    apiKey: "AIzaSyA2wqin7hWuBc91RcNqTWl_BKShDqUxPSE",
    authDomain: "online-quiz-a7f40.firebaseapp.com",
    databaseURL: "https://online-quiz-a7f40-default-rtdb.europe-west1.firebasedatabase.app", // your Realtime Database URL
    projectId: "online-quiz-a7f40",
    storageBucket: "online-quiz-a7f40.firebasestorage.app",
    messagingSenderId: "410078796989",
    appId: "1:410078796989:web:a8ad955ceef10ef348ebd4"
  };
  // ---------------------------------------------------

  // ---- for the "works when the app is fully closed" part ----
  const WORKER_URL = "https://7185-right-here.omariko3amak.workers.dev/"; // e.g. https://right-here.yourname.workers.dev
  const SHARED_SECRET = "ZFNGo8nI8H-7n0SyoTXC630eumF46x_G";
  const VAPID_KEY = "BHoW8oDTGESfvoAvGvQxy7R3VnrmgP6zHwCIPhRpn9Ff4gpfPD2cvxWKC0qoklnrlqBEQ6kkZk04icY1jOnuozM";
  // -------------------------------------------------------------

  const STORE_KEY = 'rightHereName';
  let myName = localStorage.getItem(STORE_KEY);
  const onboard = document.getElementById('onboard');
  const nameInput = document.getElementById('nameInput');
  const nameTag = document.getElementById('nameTag');
  const statusLine = document.getElementById('statusLine');
  const sendBtn = document.getElementById('sendBtn');
  const banner = document.getElementById('banner');
  const glowWave = document.getElementById('glowWave');
  const ring1 = document.getElementById('ring1');
  const ring2 = document.getElementById('ring2');

  function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function setNameTag(){
    nameTag.innerHTML = myName ? ('you are <b>'+escapeHtml(myName)+'</b> here \u00b7 <button id="changeName">not you?</button>') : '';
    const cn = document.getElementById('changeName');
    if(cn) cn.onclick = ()=>{ onboard.style.display='flex'; };
  }
  if(myName){ onboard.style.display='none'; setNameTag(); }
  document.getElementById('nameGo').onclick = saveName;
  nameInput.addEventListener('keydown', e => { if(e.key==='Enter') saveName(); });
  function saveName(){
    const v = nameInput.value.trim();
    if(!v) return;
    myName = v;
    localStorage.setItem(STORE_KEY, v);
    onboard.style.display='none';
    setNameTag();
  }

  function showBanner(text){
    banner.textContent = text;
    banner.classList.add('show');
    setTimeout(()=> banner.classList.remove('show'), 3200);
  }
  function floatHearts(){
    for(let i=0;i<7;i++){
      const el = document.createElement('div');
      el.className='float-heart';
      el.textContent = ['\ud83e\udd0d','\ud83d\udc97','\u2728'][i%3];
      el.style.left = (10 + Math.random()*80) + 'vw';
      el.style.setProperty('--drift', (Math.random()*60-30)+'px');
      el.style.animationDelay = (Math.random()*0.6)+'s';
      document.body.appendChild(el);
      setTimeout(()=> el.remove(), 4000);
    }
  }
  function pingRing(el, delay){
    el.animate([
      {width:'150px',height:'150px',left:'calc(50% - 75px)',top:'calc(50% - 75px)',opacity:0.8},
      {width:'260px',height:'260px',left:'calc(50% - 130px)',top:'calc(50% - 130px)',opacity:0}
    ], {duration:1400, delay:delay||0, easing:'ease-out'});
  }
  function receivedPulse(fromName){
    glowWave.classList.remove('pulse'); void glowWave.offsetWidth; glowWave.classList.add('pulse');
    pingRing(ring1,0); pingRing(ring2,250);
    floatHearts();
    showBanner((fromName||'they') + ' is thinking of you \ud83d\udc97');
    statusLine.textContent = (fromName||'they') + ' just reached for you';
    if(navigator.vibrate){ try{ navigator.vibrate([90,60,90,60,260]); }catch(e){} }
  }
  function sentPulse(){
    pingRing(ring1,0); pingRing(ring2,250);
    statusLine.textContent = "sent \u2014 I'll feel that in a moment \ud83d\udc97";
    if(navigator.vibrate){ try{ navigator.vibrate(40); }catch(e){} }
  }

  let lastSeenTs = 0, ready = false, dbRef = null, tokensRef = null;
  let swReg = null, pushAsked = false;

  async function registerServiceWorker(){
    if(WORKER_URL.startsWith("PASTE_") || VAPID_KEY.startsWith("PASTE_")) return;
    if(!('serviceWorker' in navigator)) return;
    try{ swReg = await navigator.serviceWorker.register('./firebase-messaging-sw.js'); }
    catch(e){ /* fine, falls back to open-tab behavior */ }
  }

  // Must be called from inside a real tap/click — browsers silently
  // ignore permission prompts triggered on page load with no gesture.
  async function requestPushPermission(){
    if(pushAsked) return;
    pushAsked = true;
    if(!swReg || !('Notification' in window)) return;
    try{
      const perm = await Notification.requestPermission();
      if(perm !== 'granted') return;
      const messaging = firebase.messaging();
      const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: swReg });
      if(token && myName) tokensRef.child(myName).set(token);
    }catch(e){ /* push just won't work on this device; the open-tab version still does */ }
  }

  async function notifyPartnerViaPush(){
    if(WORKER_URL.startsWith("PASTE_") || !tokensRef) return;
    try{
      const snap = await tokensRef.get();
      const all = snap.val() || {};
      const targets = Object.keys(all).filter(n => n !== myName).map(n => all[n]);
      for(const token of targets){
        fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Shared-Secret': SHARED_SECRET },
          body: JSON.stringify({ token, from: myName })
        }).catch(()=>{});
      }
    }catch(e){ /* the in-app live version still covers this if both happen to be open */ }
  }

  function init(){
    if(firebaseConfig.databaseURL === "PASTE_YOUR_REALTIME_DATABASE_URL_HERE"){
      statusLine.textContent = "not connected yet \u2014 add your Firebase config in the file";
      return;
    }
    firebase.initializeApp(firebaseConfig);
    dbRef = firebase.database().ref('pulses/last');
    tokensRef = firebase.database().ref('tokens');
    dbRef.on('value', (snap)=>{
      const data = snap.val();
      if(!data || !data.ts){ ready = true; return; }
      if(!ready){ lastSeenTs = data.ts; ready = true; return; }
      if(data.ts > lastSeenTs){
        lastSeenTs = data.ts;
        if(data.from !== myName) receivedPulse(data.from);
      }
    }, ()=>{ statusLine.textContent = 'lost connection \u2014 reopen this page to reconnect'; });
    registerServiceWorker();
  }

  sendBtn.addEventListener('click', ()=>{
    if(!myName){ onboard.style.display='flex'; return; }
    sentPulse();
    requestPushPermission();
    if(!dbRef) return;
    dbRef.set({ from: myName, ts: Date.now() }).catch(()=>{
      statusLine.textContent = "couldn't send \u2014 check your Firebase rules";
    });
    notifyPartnerViaPush();
  });

  init();
})();
</script>
</body>
</html>
